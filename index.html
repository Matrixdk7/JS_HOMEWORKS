<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users Albums Photos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container py-4">

    <h1 class="mb-4 text-center">Users → Albums → Photos</h1>

    <!-- Selects -->
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <select id="userSelect" class="form-select">
                <option value="">Select user...</option>
            </select>
        </div>

        <div class="col-md-4">
            <select id="albumSelect" class="form-select" disabled>
                <option value="">Select album...</option>
            </select>
        </div>

        <div class="col-md-4 d-grid">
            <button id="loadBtn" class="btn btn-primary" disabled>
                Load photos
            </button>
        </div>
    </div>

    <!-- Status -->
    <div id="status" class="mb-3 text-center fw-semibold text-secondary"></div>

    <!-- Photos container -->
    <div id="photos" class="row g-4"></div>
<!--    <div class="d-grid my-3">-->
<!--        <button id="loadMoreBtn" class="btn btn-secondary" style="display:none;">Load more</button>-->
<!--    </div>-->

</div>

<script src="./js/app.js"></script>
</body>
</html>
