<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма реєстрації</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h1 class="mb-4 text-center">Реєстрація</h1>

            <form id="registrationForm" novalidate data-form>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            data-form-email
                    >
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>

                    <div class="input-group">
                        <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                data-original-password
                        >
                        <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="togglePassword"
                        >
                            Показати
                        </button>
                    </div>

                    <!-- Password strength -->
                    <div class="form-text mt-1">
                        Сила пароля:
                        <span id="passwordStrength" class="fw-bold">
                            —
                        </span>
                    </div>
                </div>

                <!-- Confirm password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Підтвердження пароля
                    </label>
                    <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            data-confirm-password
                    >
                </div>

                <!-- Age -->
                <div class="mb-3">
                    <label for="age" class="form-label">Вік</label>
                    <input
                            type="number"
                            class="form-control"
                            id="age"
                            name="age"
                            data-age
                    >
                </div>

                <!-- City -->
                <div class="mb-3">
                    <label for="city" class="form-label">Місто</label>
                    <select
                            class="form-select"
                            id="city"
                            name="city"
                            data-city
                    >
                        <option value="">Оберіть місто</option>
                        <option value="kyiv">Київ</option>
                        <option value="lviv">Львів</option>
                        <option value="odessa">Одеса</option>
                        <option value="kharkiv">Харків</option>
                    </select>
                </div>

                <!-- Terms -->
                <div class="mb-3 form-check">
                    <input
                            type="checkbox"
                            class="form-check-input"
                            id="terms"
                            name="terms"
                            data-terms
                    >
                    <label class="form-check-label" for="terms">
                        Погоджуюсь з умовами
                    </label>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button
                            type="submit"
                            class="btn btn-primary w-100"
                    >
                        Зареєструватись
                    </button>

                    <button
                            type="button"
                            class="btn btn-outline-secondary w-100"
                            id="clearForm"
                            data-clear-btn
                    >
                        Очистити
                    </button>
                </div>
            </form>

            <!-- JSON result -->
            <div class="mt-4">
                <h5>Результат (JSON)</h5>
                <pre
                        id="result"
                        class="bg-dark text-light p-3 rounded"
                >
{}
                </pre>
            </div>

        </div>
    </div>
</div>
<script src="js/validator.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
