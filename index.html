<!DOCTYPE html>

<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Notes Board</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body>

<div class="container py-4">

    <h1 class="mb-4">Notes Board</h1>

    <!-- FORM -->

    <div class="card mb-4">
        <div class="card-body">

            <form id="noteForm" novalidate>
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Title</label>
                        <input name="title"
                               type="text"
                                class="form-control"
                                id="noteTitle"
                                placeholder="Enter note title"
                                required
                        >
                        <div id="titleError" class="text-danger small mt-1 d-none">
                            Title must be at least 3 characters
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Category</label>
                        <select id="noteCategory" class="form-select" name="category">
                            <option value="work">Work</option>
                            <option value="study">Study</option>
                            <option value="personal">Personal</option>
                        </select>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100" type="submit">
                            Add note
                        </button>
                    </div>

                </div>
            </form>

        </div>

    </div>

    <!-- ACTION BAR -->

    <div class="d-flex justify-content-between align-items-center mb-3">
        <button id="clearAllBtn" class="btn btn-outline-danger">
            Clear all
        </button>

        <div id="notesCounter" class="text-muted small">
            <!-- bonus -->
        </div>

    </div>

    <!-- EMPTY MESSAGE -->

    <div id="emptyMessage" class="alert alert-secondary text-center">
        No notes yet
    </div>

    <!-- NOTES LIST -->

    <div id="notesList" class="row g-3 ">
        <!-- cards here -->
    </div>

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
